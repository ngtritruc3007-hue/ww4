<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thư viện cảnh đẹp thiên nhiên</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Thư viện cảnh đẹp thiên nhiên</h1>
    <p>Một bộ sưu tập nhỏ những khung cảnh yên bình từ núi rừng đến mặt hồ.</p>
  </header>
  <main>
    <figure>
      <img src="https://picsum.photos/id/1015/600/400" width="600" height="400" alt="Dòng sông uốn lượn giữa thung lũng xanh">
      <figcaption>Dòng sông uốn lượn giữa thung lũng.</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1018/600/400" width="600" height="400" alt="Dãy núi phủ cỏ xanh dưới bầu trời trong">
      <figcaption>Dãy núi xanh dưới bầu trời trong.</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1019/600/400" width="600" height="400" alt="Bờ biển đá nhìn từ trên cao">
      <figcaption>Bờ biển đá nhìn từ trên cao.</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1039/600/400" width="600" height="400" alt="Thác nước chảy qua những tảng đá rêu phong">
      <figcaption>Thác nước giữa rừng già.</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1043/600/400" width="600" height="400" alt="Hồ nước phẳng lặng phản chiếu cây thông">
      <figcaption>Mặt hồ phẳng lặng buổi sớm.</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1036/600/400" width="600" height="400" alt="Cánh đồng phủ tuyết trắng trải dài">
      <figcaption>Cánh đồng tuyết trải dài.</figcaption>
    </figure>
  </main>
</body>
</html>
